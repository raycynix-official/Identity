name: Release .NET Program

on:
  push:
    branches:
      - release

permissions:
  contents: write
  pull-requests: read

jobs:
  get-version:
    name: Getting version from .csproj
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-proj-version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Get Version Number
        id: get-proj-version
        uses: raycynix-official/get-csproj-version-action@v1.2.0

  draft:
    name: Setting up draft release
    runs-on: ubuntu-latest
    needs: get-version

    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Update Draft Release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
          version: ${{ needs.get-version.outputs.version }}
          tag: v${{ needs.get-version.outputs.version }}
          name: Release v${{ needs.get-version.outputs.version }}
          commitish: release
          publish: false
          prerelease: false